[project]
name = "cli-context-packets"
version = "0.1.0"
description = "Full-source CLI context packets connected to LangGraph and local stdio models"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "langgraph",
  "mcp>=1.26,<2",
  "diskcache>=5.6.3",
  "grep-ast==0.9.0",
  "tree-sitter-language-pack==0.13.0",
  "tree-sitter==0.25.2",
  "networkx==3.4.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "pygments>=2.18",
  "rich>=13.9",
  "tqdm>=4.66",
  "tiktoken==0.12.0",
]

[project.scripts]
context-packets = "context_packets.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.12"]

[tool.uv.sources]
langgraph = { path = "../../libs/langgraph", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["context_packets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
